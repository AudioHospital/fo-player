<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frequency Oasis — Player</title>
<meta name="description" content="Frequency Oasis local video player by Smokey Eye Beats">
<meta name="theme-color" content="#c9a84c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FO Player">

<!-- Inline SVG icon as data URI for apple-touch-icon -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23080808'/%3E%3Ccircle cx='256' cy='256' r='220' fill='none' stroke='%23c9a84c' stroke-width='18'/%3E%3Ccircle cx='256' cy='256' r='140' fill='none' stroke='%23c9a84c' stroke-width='8' stroke-dasharray='20 10'/%3E%3Ccircle cx='256' cy='256' r='60' fill='%23c9a84c'/%3E%3Ccircle cx='256' cy='256' r='28' fill='%23080808'/%3E%3Cline x1='256' y1='36' x2='256' y2='116' stroke='%23c9a84c' stroke-width='12' stroke-linecap='round'/%3E%3Cline x1='256' y1='396' x2='256' y2='476' stroke='%23c9a84c' stroke-width='12' stroke-linecap='round'/%3E%3Cline x1='36' y1='256' x2='116' y2='256' stroke='%23c9a84c' stroke-width='12' stroke-linecap='round'/%3E%3Cline x1='396' y1='256' x2='476' y2='256' stroke='%23c9a84c' stroke-width='12' stroke-linecap='round'/%3E%3C/svg%3E">

<!-- Inline manifest via blob — injected by JS below -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --gold: #c9a84c;
    --gold-dim: #7a5f24;
    --black: #080808;
    --surface: #111010;
    --surface2: #1a1916;
    --text: #e8dfc8;
    --muted: #5a5040;
    --accent: #c9a84c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  header {
    width: 100%;
    padding: 24px 32px 16px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    border-bottom: 1px solid #1f1d18;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.12em;
    color: var(--gold);
    line-height: 1;
  }

  .logo span {
    color: var(--muted);
    font-size: 0.8rem;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.3em;
    margin-left: 8px;
    vertical-align: middle;
  }

  .main {
    width: 100%;
    max-width: 1100px;
    padding: 24px 20px;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
  }

  @media (max-width: 780px) {
    .main { grid-template-columns: 1fr; }
  }

  /* VIDEO AREA */
  .video-section {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .video-wrapper {
    position: relative;
    background: #000;
    border: 1px solid #1f1d18;
    aspect-ratio: 16/9;
    overflow: hidden;
  }

  .video-wrapper video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .drop-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .drop-overlay:hover { background: rgba(201,168,76,0.04); }

  .drop-icon {
    font-size: 3rem;
    color: var(--gold-dim);
    line-height: 1;
  }

  .drop-text {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    color: var(--gold-dim);
  }

  .drop-sub {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .drop-overlay.hidden { display: none; }

  /* CONTROLS */
  .controls {
    background: var(--surface);
    border: 1px solid #1f1d18;
    border-top: none;
    padding: 14px 16px;
  }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .time-label {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    white-space: nowrap;
    min-width: 36px;
  }

  .progress-bar {
    flex: 1;
    height: 3px;
    background: #222;
    border-radius: 0;
    cursor: pointer;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.1s linear;
    position: relative;
  }

  .progress-fill::after {
    content: '';
    position: absolute;
    right: -4px;
    top: -4px;
    width: 10px;
    height: 10px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.2s;
  }

  .progress-bar:hover .progress-fill::after { opacity: 1; }

  /* Buttons row */
  .btn-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    background: none;
    border: 1px solid #2a2820;
    color: var(--text);
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    padding: 7px 14px;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .btn.active {
    background: var(--gold);
    color: var(--black);
    border-color: var(--gold);
  }

  .btn-icon {
    padding: 7px 12px;
    font-size: 0.85rem;
  }

  .spacer { flex: 1; }

  /* Volume */
  .vol-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .vol-label {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.15em;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 80px;
    height: 2px;
    background: #2a2820;
    cursor: pointer;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    background: var(--gold);
    border-radius: 50%;
  }

  /* Now playing strip */
  .now-playing {
    margin-top: 10px;
    padding: 8px 0 0;
    border-top: 1px solid #1a1916;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .np-label {
    font-size: 0.6rem;
    color: var(--gold-dim);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .np-title {
    font-size: 0.75rem;
    color: var(--text);
    letter-spacing: 0.05em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 400px;
  }

  /* PLAYLIST */
  .playlist-section {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .playlist-header {
    background: var(--surface);
    border: 1px solid #1f1d18;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pl-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.2em;
    color: var(--gold);
  }

  .pl-count {
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.15em;
  }

  .playlist-list {
    background: var(--surface2);
    border: 1px solid #1f1d18;
    border-top: none;
    flex: 1;
    overflow-y: auto;
    max-height: 420px;
    min-height: 200px;
  }

  .playlist-list::-webkit-scrollbar { width: 3px; }
  .playlist-list::-webkit-scrollbar-track { background: #111; }
  .playlist-list::-webkit-scrollbar-thumb { background: var(--gold-dim); }

  .pl-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    line-height: 2;
  }

  .pl-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid #161512;
    cursor: pointer;
    transition: background 0.1s;
    position: relative;
  }

  .pl-item:hover { background: #1c1a16; }

  .pl-item.active {
    background: #1e1b14;
    border-left: 2px solid var(--gold);
  }

  .pl-num {
    font-size: 0.6rem;
    color: var(--muted);
    min-width: 20px;
    text-align: right;
  }

  .pl-item.active .pl-num { color: var(--gold); }

  .pl-name {
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }

  .pl-item.active .pl-name { color: var(--gold); }

  .pl-dur {
    font-size: 0.6rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .pl-remove {
    background: none;
    border: none;
    color: #333;
    cursor: pointer;
    font-size: 0.75rem;
    padding: 2px 4px;
    line-height: 1;
    transition: color 0.15s;
  }

  .pl-remove:hover { color: #c44; }

  .playlist-footer {
    background: var(--surface);
    border: 1px solid #1f1d18;
    border-top: none;
    padding: 10px 14px;
    display: flex;
    gap: 8px;
  }

  .add-btn {
    flex: 1;
    background: none;
    border: 1px solid #2a2820;
    color: var(--gold-dim);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .add-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* Preview thumbnail */
  .preview-wrap {
    position: relative;
  }

  .preview-canvas {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 90px;
    border: 1px solid var(--gold-dim);
    background: #000;
    display: none;
    pointer-events: none;
    z-index: 10;
  }

  .preview-wrap:hover .preview-canvas { display: block; }

  /* Playback speed */
  .speed-select {
    background: #111;
    border: 1px solid #2a2820;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    padding: 6px 8px;
    cursor: pointer;
    letter-spacing: 0.1em;
  }

  .speed-select:focus { outline: none; border-color: var(--gold); }

  /* Fullscreen hint */
  .hint {
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-align: center;
    padding: 8px;
    opacity: 0.5;
  }

  /* Playing indicator pulse */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .playing-dot {
    width: 6px;
    height: 6px;
    background: var(--gold);
    border-radius: 50%;
    display: none;
    animation: pulse 1.2s ease infinite;
  }

  .playing .playing-dot { display: inline-block; }

  /* Drag highlight */
  .video-wrapper.drag-over {
    border-color: var(--gold);
    box-shadow: inset 0 0 30px rgba(201,168,76,0.08);
  }
</style>
</head>
<body>

<header>
  <div class="logo">Frequency Oasis <span>// LOCAL PLAYER</span></div>
  <div class="playing-dot" id="playingDot"></div>
</header>

<div class="main">
  <!-- VIDEO SECTION -->
  <div class="video-section">
    <div class="video-wrapper" id="videoWrapper">
      <video id="vid" preload="metadata"></video>
      <div class="drop-overlay" id="dropOverlay">
        <div class="drop-icon">▣</div>
        <div class="drop-text">Drop Video Files</div>
        <div class="drop-sub">or click to browse · mp4, mov, mkv, webm, avi</div>
      </div>
    </div>

    <div class="controls">
      <!-- Progress -->
      <div class="progress-row preview-wrap">
        <span class="time-label" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
          <canvas class="preview-canvas" id="previewCanvas" width="160" height="90"></canvas>
        </div>
        <span class="time-label" id="duration">0:00</span>
      </div>

      <!-- Buttons -->
      <div class="btn-row">
        <button class="btn btn-icon" id="btnPrev" title="Previous">⏮</button>
        <button class="btn btn-icon" id="btnPlay" title="Play/Pause">▶</button>
        <button class="btn btn-icon" id="btnNext" title="Next">⏭</button>
        <button class="btn btn-icon" id="btnStop" title="Stop">■</button>
        <div class="spacer"></div>
        <div class="vol-row">
          <span class="vol-label">VOL</span>
          <input type="range" id="volSlider" min="0" max="1" step="0.02" value="1">
        </div>
        <button class="btn btn-icon" id="btnMute" title="Mute">🔊</button>
        <select class="speed-select" id="speedSelect">
          <option value="0.5">0.5×</option>
          <option value="0.75">0.75×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
        <button class="btn btn-icon" id="btnLoop" title="Loop">↺</button>
        <button class="btn btn-icon" id="btnFullscreen" title="Fullscreen">⛶</button>
      </div>

      <!-- Now playing -->
      <div class="now-playing">
        <span class="np-label">Playing</span>
        <span class="np-title" id="npTitle">— No file loaded —</span>
      </div>
    </div>
    <div class="hint">Drag files onto player · Double-click video for fullscreen · Space = play/pause</div>
  </div>

  <!-- PLAYLIST -->
  <div class="playlist-section">
    <div class="playlist-header">
      <span class="pl-title">Playlist</span>
      <span class="pl-count" id="plCount">0 files</span>
    </div>
    <div class="playlist-list" id="playlistList">
      <div class="pl-empty">No videos loaded.<br>Drop files or use Add button.</div>
    </div>
    <div class="playlist-footer">
      <button class="add-btn" id="btnAdd">+ Add Files</button>
      <button class="add-btn" id="btnClear">Clear All</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept="video/*" style="display:none">

<script>
  // ─── INLINE MANIFEST + ICON ──────────────────────────────────────────────
  // Icon SVG — gold frequency ring on black
  const ICON_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="80" fill="#080808"/>
    <circle cx="256" cy="256" r="210" fill="none" stroke="#c9a84c" stroke-width="18"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke="#c9a84c" stroke-width="8" stroke-dasharray="22 12"/>
    <circle cx="256" cy="256" r="90" fill="none" stroke="#7a5f24" stroke-width="4"/>
    <circle cx="256" cy="256" r="56" fill="#c9a84c"/>
    <circle cx="256" cy="256" r="24" fill="#080808"/>
    <line x1="256" y1="46" x2="256" y2="106" stroke="#c9a84c" stroke-width="14" stroke-linecap="round"/>
    <line x1="256" y1="406" x2="256" y2="466" stroke="#c9a84c" stroke-width="14" stroke-linecap="round"/>
    <line x1="46" y1="256" x2="106" y2="256" stroke="#c9a84c" stroke-width="14" stroke-linecap="round"/>
    <line x1="406" y1="256" x2="466" y2="256" stroke="#c9a84c" stroke-width="14" stroke-linecap="round"/>
    <text x="256" y="490" text-anchor="middle" font-family="monospace" font-size="38" fill="#7a5f24" letter-spacing="4">FO</text>
  </svg>`;

  // Convert SVG to data URL for manifest icons
  const iconDataUrl = 'data:image/svg+xml,' + encodeURIComponent(ICON_SVG);
  const iconBase64  = 'data:image/svg+xml;base64,' + btoa(ICON_SVG);

  // Build manifest JSON inline
  const manifest = {
    name: "Frequency Oasis Player",
    short_name: "FO Player",
    description: "Local video player by Smokey Eye Beats",
    start_url: ".",
    display: "standalone",
    background_color: "#080808",
    theme_color: "#c9a84c",
    orientation: "any",
    icons: [
      { src: iconDataUrl, sizes: "any", type: "image/svg+xml", purpose: "any maskable" },
      { src: iconBase64,  sizes: "512x512", type: "image/svg+xml" }
    ]
  };

  // Inject manifest link tag dynamically
  const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
  const manifestUrl  = URL.createObjectURL(manifestBlob);
  const manifestLink = document.createElement('link');
  manifestLink.rel   = 'manifest';
  manifestLink.href  = manifestUrl;
  document.head.appendChild(manifestLink);

  // Also update apple-touch-icon to use the base64 version (better iOS support)
  const appleLink = document.querySelector('link[rel="apple-touch-icon"]');
  if (appleLink) appleLink.href = iconBase64;

  // ─── PLAYER LOGIC ────────────────────────────────────────────────────────
  const vid = document.getElementById('vid');
  const dropOverlay = document.getElementById('dropOverlay');
  const videoWrapper = document.getElementById('videoWrapper');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const npTitle = document.getElementById('npTitle');
  const playlistList = document.getElementById('playlistList');
  const plCount = document.getElementById('plCount');
  const fileInput = document.getElementById('fileInput');
  const playingDot = document.getElementById('playingDot');

  let playlist = [];
  let currentIndex = -1;
  let looping = false;
  let muted = false;

  function fmt(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function addFiles(files) {
    Array.from(files).forEach(f => {
      if (!f.type.startsWith('video/') && !f.name.match(/\.(mp4|mov|mkv|webm|avi|m4v|flv)$/i)) return;
      playlist.push({ file: f, name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f) });
    });
    renderPlaylist();
    if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
  }

  function renderPlaylist() {
    plCount.textContent = `${playlist.length} file${playlist.length !== 1 ? 's' : ''}`;
    if (playlist.length === 0) {
      playlistList.innerHTML = '<div class="pl-empty">No videos loaded.<br>Drop files or use Add button.</div>';
      return;
    }
    playlistList.innerHTML = '';
    playlist.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'pl-item' + (i === currentIndex ? ' active' : '');
      div.innerHTML = `
        <span class="pl-num">${i + 1}</span>
        <span class="pl-name" title="${item.name}">${item.name}</span>
        <span class="pl-dur" id="dur-${i}">—</span>
        <button class="pl-remove" data-i="${i}" title="Remove">✕</button>
      `;
      div.addEventListener('click', (e) => {
        if (e.target.classList.contains('pl-remove')) return;
        loadTrack(i);
      });
      div.querySelector('.pl-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTrack(i);
      });
      playlistList.appendChild(div);

      // Pre-load duration
      const tmpVid = document.createElement('video');
      tmpVid.src = item.url;
      tmpVid.preload = 'metadata';
      tmpVid.onloadedmetadata = () => {
        const el = document.getElementById(`dur-${i}`);
        if (el) el.textContent = fmt(tmpVid.duration);
      };
    });
  }

  function removeTrack(i) {
    URL.revokeObjectURL(playlist[i].url);
    playlist.splice(i, 1);
    if (currentIndex === i) {
      currentIndex = -1;
      vid.src = '';
      npTitle.textContent = '— No file loaded —';
      dropOverlay.classList.remove('hidden');
      progressFill.style.width = '0%';
      currentTimeEl.textContent = '0:00';
      durationEl.textContent = '0:00';
    } else if (currentIndex > i) {
      currentIndex--;
    }
    renderPlaylist();
  }

  function loadTrack(i) {
    if (i < 0 || i >= playlist.length) return;
    currentIndex = i;
    vid.src = playlist[i].url;
    npTitle.textContent = playlist[i].name;
    dropOverlay.classList.add('hidden');
    vid.play();
    renderPlaylist();
    document.title = `▶ ${playlist[i].name} — Frequency Oasis`;
  }

  // Playback controls
  document.getElementById('btnPlay').addEventListener('click', () => {
    if (vid.paused) vid.play(); else vid.pause();
  });

  document.getElementById('btnStop').addEventListener('click', () => {
    vid.pause();
    vid.currentTime = 0;
  });

  document.getElementById('btnPrev').addEventListener('click', () => {
    if (vid.currentTime > 3) { vid.currentTime = 0; return; }
    if (currentIndex > 0) loadTrack(currentIndex - 1);
  });

  document.getElementById('btnNext').addEventListener('click', () => {
    if (currentIndex < playlist.length - 1) loadTrack(currentIndex + 1);
  });

  document.getElementById('btnMute').addEventListener('click', () => {
    muted = !muted;
    vid.muted = muted;
    document.getElementById('btnMute').textContent = muted ? '🔇' : '🔊';
  });

  document.getElementById('btnLoop').addEventListener('click', () => {
    looping = !looping;
    vid.loop = looping;
    document.getElementById('btnLoop').classList.toggle('active', looping);
  });

  document.getElementById('btnFullscreen').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else videoWrapper.requestFullscreen();
  });

  document.getElementById('speedSelect').addEventListener('change', (e) => {
    vid.playbackRate = parseFloat(e.target.value);
  });

  document.getElementById('volSlider').addEventListener('input', (e) => {
    vid.volume = e.target.value;
  });

  // Progress bar
  progressBar.addEventListener('click', (e) => {
    if (!vid.duration) return;
    const rect = progressBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    vid.currentTime = ratio * vid.duration;
  });

  vid.addEventListener('timeupdate', () => {
    if (!vid.duration) return;
    const pct = (vid.currentTime / vid.duration) * 100;
    progressFill.style.width = pct + '%';
    currentTimeEl.textContent = fmt(vid.currentTime);
  });

  vid.addEventListener('loadedmetadata', () => {
    durationEl.textContent = fmt(vid.duration);
  });

  vid.addEventListener('play', () => {
    document.getElementById('btnPlay').textContent = '⏸';
    playingDot.parentElement.classList.add('playing');
  });

  vid.addEventListener('pause', () => {
    document.getElementById('btnPlay').textContent = '▶';
    playingDot.parentElement.classList.remove('playing');
  });

  vid.addEventListener('ended', () => {
    if (!looping) {
      if (currentIndex < playlist.length - 1) loadTrack(currentIndex + 1);
      else { document.title = 'Frequency Oasis — Player'; }
    }
  });

  // Double click fullscreen
  vid.addEventListener('dblclick', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else videoWrapper.requestFullscreen();
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.code === 'Space') { e.preventDefault(); if (vid.paused) vid.play(); else vid.pause(); }
    if (e.code === 'ArrowRight') vid.currentTime = Math.min(vid.duration, vid.currentTime + 5);
    if (e.code === 'ArrowLeft') vid.currentTime = Math.max(0, vid.currentTime - 5);
    if (e.code === 'ArrowUp') { vid.volume = Math.min(1, vid.volume + 0.1); document.getElementById('volSlider').value = vid.volume; }
    if (e.code === 'ArrowDown') { vid.volume = Math.max(0, vid.volume - 0.1); document.getElementById('volSlider').value = vid.volume; }
    if (e.code === 'KeyF') { if (document.fullscreenElement) document.exitFullscreen(); else videoWrapper.requestFullscreen(); }
    if (e.code === 'KeyN') { if (currentIndex < playlist.length - 1) loadTrack(currentIndex + 1); }
    if (e.code === 'KeyP') { if (currentIndex > 0) loadTrack(currentIndex - 1); }
  });

  // File input
  document.getElementById('btnAdd').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => addFiles(e.target.files));
  document.getElementById('btnClear').addEventListener('click', () => {
    playlist.forEach(p => URL.revokeObjectURL(p.url));
    playlist = [];
    currentIndex = -1;
    vid.src = '';
    npTitle.textContent = '— No file loaded —';
    dropOverlay.classList.remove('hidden');
    document.title = 'Frequency Oasis — Player';
    renderPlaylist();
  });

  // Drop on overlay
  dropOverlay.addEventListener('click', () => fileInput.click());

  // Drag and drop anywhere on player
  videoWrapper.addEventListener('dragover', (e) => {
    e.preventDefault();
    videoWrapper.classList.add('drag-over');
  });

  videoWrapper.addEventListener('dragleave', () => videoWrapper.classList.remove('drag-over'));

  videoWrapper.addEventListener('drop', (e) => {
    e.preventDefault();
    videoWrapper.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });

  // Global drag drop
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => {
    e.preventDefault();
    addFiles(e.dataTransfer.files);
  });

  // ─── PWA INSTALL PROMPT ──────────────────────────────────────────────────
  let deferredPrompt;
  const installBtn = document.createElement('button');
  installBtn.className = 'btn';
  installBtn.textContent = '⬇ Install App';
  installBtn.style.cssText = [
    'display:none','position:fixed','bottom:16px','right:16px','z-index:1000',
    'background:#c9a84c','color:#080808','border:none','padding:10px 18px',
    'font-family:Space Mono,monospace','font-size:0.75rem',
    'letter-spacing:0.1em','cursor:pointer'
  ].join(';');
  document.body.appendChild(installBtn);

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') installBtn.style.display = 'none';
    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
  });

  // ─── SERVICE WORKER (blob) ───────────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    const swCode = `
      const CACHE = 'fo-player-v2';
      self.addEventListener('install', e => {
        self.skipWaiting();
      });
      self.addEventListener('activate', e => {
        e.waitUntil(
          caches.keys().then(keys =>
            Promise.all(keys.filter(k => k !== 'fo-player-v2').map(k => caches.delete(k)))
          )
        );
      });
      self.addEventListener('fetch', e => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;
    const blob   = new Blob([swCode], { type: 'application/javascript' });
    const swUrl  = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl, { scope: '/' }).catch(() => {});
  }
</script>
</body>
</html>
